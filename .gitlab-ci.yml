include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/payment-scheduler
  TgsSettingKey: payment-scheduler
  BuildCacheKey: Tgs.Payment.Scheduler.$CI_PIPELINE_ID
  HelmTemplateFolderName: payment-scheduler

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template  

push-docker-image:
  extends: .push-docker-image-template
  script:    
    - push_docker "Tgs.Payment.Scheduler" $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-k8s-template
  variables:    
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  tags:
  - dev
  - kubernetes
  - deploy
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success

deploy-staging:
  extends: .deploy-k8s-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  tags:
    - staging
    - kubernetes
    - deploy
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

deploy-prod:
  extends: .deploy-k8s-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  tags:
    - prod
    - kubernetes
    - deploy
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual  
